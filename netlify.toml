[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/privacybeleid"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/voorwaarden"
  to = "/voorwaarden.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/voorwaarden.html"
  status = 200
