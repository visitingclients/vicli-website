[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Automatisch doorsturen van vicli.netlify.app naar je eigen domein vicli.nl
[[redirects]]
  from = "https://vicli.netlify.app/*"
  to = "https://vicli.nl/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://vicli.netlify.app/*"
  to = "https://vicli.nl/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/privacybeleid"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/voorwaarden"
  to = "/voorwaarden.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/voorwaarden.html"
  status = 200

[[redirects]]
  from = "/tutorial"
  to = "/tutorial.html"
  status = 200

[[redirects]]
  from = "/handleiding"
  to = "/tutorial.html"
  status = 200
